<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="춤추는 고양이">
  <g id="cat-body">
    <!-- tail -->
    <path d="M158 130 Q188 120 182 90 Q178 68 156 74" fill="none" stroke="#ff9d4d" stroke-width="14" stroke-linecap="round" class="cat-tail"/>
    <!-- body -->
    <ellipse cx="100" cy="140" rx="42" ry="34" fill="#ff9d4d"/>
    <!-- head -->
    <circle cx="100" cy="82" r="40" fill="#ffb066"/>
    <!-- ears -->
    <path d="M66 60 L58 24 L92 52 Z" fill="#ffb066"/>
    <path d="M134 60 L142 24 L108 52 Z" fill="#ffb066"/>
    <path d="M70 54 L65 34 L86 50 Z" fill="#ff8fb3"/>
    <path d="M130 54 L135 34 L114 50 Z" fill="#ff8fb3"/>
    <!-- face stripes -->
    <path d="M60 78 Q100 68 140 78" fill="none" stroke="#e8853a" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    <!-- eyes -->
    <ellipse cx="82" cy="82" rx="7" ry="9" fill="#2b2b2b" class="cat-eye"/>
    <ellipse cx="118" cy="82" rx="7" ry="9" fill="#2b2b2b" class="cat-eye"/>
    <circle cx="84" cy="79" r="2" fill="#fff"/>
    <circle cx="120" cy="79" r="2" fill="#fff"/>
    <!-- nose & mouth -->
    <path d="M96 96 L104 96 L100 102 Z" fill="#d6567a"/>
    <path d="M100 102 Q100 108 92 108" fill="none" stroke="#2b2b2b" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M100 102 Q100 108 108 108" fill="none" stroke="#2b2b2b" stroke-width="2.5" stroke-linecap="round"/>
    <!-- whiskers -->
    <path d="M58 92 L28 86" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M58 100 L26 100" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M142 92 L172 86" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M142 100 L174 100" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
    <!-- front paws -->
    <ellipse cx="82" cy="172" rx="12" ry="14" fill="#ffb066" class="cat-paw cat-paw-left"/>
    <ellipse cx="118" cy="172" rx="12" ry="14" fill="#ffb066" class="cat-paw cat-paw-right"/>
  </g>
</svg>
