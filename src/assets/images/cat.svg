<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
  <!-- Body -->
  <ellipse cx="100" cy="170" rx="55" ry="60" fill="#f5c542"/>
  <!-- Head -->
  <circle cx="100" cy="90" r="52" fill="#f5c542"/>
  <!-- Left ear -->
  <polygon points="55,50 40,15 75,38" fill="#f5c542"/>
  <polygon points="57,47 45,22 70,40" fill="#ffaaaa"/>
  <!-- Right ear -->
  <polygon points="145,50 160,15 125,38" fill="#f5c542"/>
  <polygon points="143,47 155,22 130,40" fill="#ffaaaa"/>
  <!-- Face stripe left -->
  <ellipse cx="72" cy="80" rx="12" ry="18" fill="#e0a800" opacity="0.4"/>
  <!-- Face stripe right -->
  <ellipse cx="128" cy="80" rx="12" ry="18" fill="#e0a800" opacity="0.4"/>
  <!-- Eyes -->
  <ellipse cx="80" cy="82" rx="10" ry="12" fill="white"/>
  <ellipse cx="120" cy="82" rx="10" ry="12" fill="white"/>
  <circle cx="82" cy="85" r="7" fill="#333"/>
  <circle cx="122" cy="85" r="7" fill="#333"/>
  <circle cx="84" cy="83" r="2.5" fill="white"/>
  <circle cx="124" cy="83" r="2.5" fill="white"/>
  <!-- Nose -->
  <polygon points="100,100 95,107 105,107" fill="#ff6b9d"/>
  <!-- Mouth -->
  <path d="M95,107 Q100,114 105,107" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Whiskers left -->
  <line x1="45" y1="100" x2="88" y2="103" stroke="#888" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="45" y1="108" x2="88" y2="107" stroke="#888" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="48" y1="116" x2="88" y2="111" stroke="#888" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Whiskers right -->
  <line x1="155" y1="100" x2="112" y2="103" stroke="#888" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="155" y1="108" x2="112" y2="107" stroke="#888" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="152" y1="116" x2="112" y2="111" stroke="#888" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Belly spot -->
  <ellipse cx="100" cy="175" rx="30" ry="35" fill="#fde8a0"/>
  <!-- Left arm -->
  <ellipse cx="52" cy="165" rx="14" ry="28" fill="#f5c542" transform="rotate(-20 52 165)"/>
  <!-- Right arm -->
  <ellipse cx="148" cy="165" rx="14" ry="28" fill="#f5c542" transform="rotate(20 148 165)"/>
  <!-- Left leg -->
  <ellipse cx="75" cy="222" rx="18" ry="14" fill="#f5c542"/>
  <!-- Right leg -->
  <ellipse cx="125" cy="222" rx="18" ry="14" fill="#f5c542"/>
  <!-- Left paw -->
  <ellipse cx="75" cy="232" rx="16" ry="8" fill="#f5c542"/>
  <ellipse cx="125" cy="232" rx="16" ry="8" fill="#f5c542"/>
  <!-- Tail -->
  <path d="M155,190 Q200,160 190,120 Q185,100 170,110" fill="none" stroke="#f5c542" stroke-width="16" stroke-linecap="round"/>
  <path d="M170,110 Q175,95 165,95" fill="none" stroke="#e0a800" stroke-width="8" stroke-linecap="round"/>
</svg>
